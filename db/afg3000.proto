# This is a protocol file for AFG3000 series
#
terminator = LF;
intFuncFormat = "%{SIN|SQU|TRI|RAMP|NRAM|PRN|USER|USER2|USER3|USER4|EMEM|EFIL}";
srcFuncFormat = "%#{SQU=1|PULS|RAMP|PRN|DC|SINC|GAUS|LOR|ERIS|EDEC|HAV|USER2=13|USER3|USER4|EMEM|EFIL|SIN=0|USER=12}";


# Output commands
# @param $1 channel number

getOutputImpedance {
    out "OUTP\$1:IMP?";
        in  "%f";
	}
	setOutputImpedance {
	    out "OUTP\$1:IMP %f";
	        @init{getOutputImpedance;};
		}

getOutputPolarity {
    out "OUTP\$1:POL?";
        in  "%{NORM|INV}";
	}
	setOutputPolarity {
	    out "OUTP\$1:POL %{NORM|INV}";
	        @init{getOutputPolarity;};
		}

getOutputState {
    out "OUTP\$1:STAT?";
        in  "%d";
	}
	setOutputState {
	    out "OUTP\$1:STAT %{OFF|ON}";
	        @init{getOutputState;};
		}

getOutputTriggerMode {
    out "OUTP:TRIG:MODE?";
        in  "%{TRIG|SYNC}";
	}
	setOutputTriggerMode {
	    out "OUTP:TRIG:MODE %{TRIG|SYNC}";
	        @init{getOutputTriggerMode;};
		}

