# System commands
getIdentification {
    out "*IDN?";
        in  "%[^,],%(\$1-IMDL)[^,],%(\$1-ISN)[^,],%(\$1-IFW)[^,]";
	}

reset {
    out "*RST";
    }

# Data commands
getDataCatalog {
    Separator=",";
        out "DATA:CAT?";
	    in  "\"%[^\"]\"";
	    }

# Copy content from source to target memories.
# $1 Target  (EMEM|USER|USER2|USER3|USER4)
# $2 Source  (EMEM|USER|USER2|USER3|USER4)
setDataCopy {
    out "DATA:COPY \$1,\$2";
    }

# $1 Field which contains the number of digits in NORD.
getDataData {
    out "DATA:DATA? EMEM";
        in  "%s";
	}
	setDataData {
	    out "DATA:DATA EMEM,#%(\$1)%(NORD)%s";
	    }

setDataDelete{}
getDataDelete{}

setDataDefine{}
getDataDefine{}

setDataLock{}
getDataLock{}

setDataPoints{}
getDataPoints{}

setDataDataLine{}
getDataDataLine{}

setDataDataValue{}
getDataDataValue{}

# Trigger commands
getTriggerSlope {
    out "TRIG:SLOP?";
